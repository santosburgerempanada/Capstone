[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebus"
version = "0.1.0"
description = "Programación y carga conjunta de buses eléctricos multi-depósito (Jia & An, 2025) para Santiago"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "networkx",
    "pyyaml",
    "gurobipy",
    "matplotlib",
    "geopandas",
    "tqdm",
    "openpyxl",
    "alns==7.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
