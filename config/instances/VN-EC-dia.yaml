# Día hábil completo de Vespucio Norte y El Conquistador juntos (24 736 viajes, 2 depósitos): cualquier bus de
# cualquiera de los dos depósitos puede hacer cualquier viaje (multi-depósito, como el paper). Ver
# docs/planes/cerrados/plan_dos_terminales.md. Comparar contra VN-dia + EC-dia (cada terminal solo).
extends: ../particion.yaml

case:
  name: VN-EC-dia

data:
  source: subproblema
  trips_file: data/processed/centroide/viajes_dia_habil.csv
  terminales: [Vespucio Norte, El Conquistador]   # en vez de terminal: varios terminales con sus depósitos
  deadhead_file: data/interim/deadhead_VN-EC.csv  # scripts/generar_deadheads.py --config config/instances/VN-EC-dia.yaml

network:
  day_start: "04:00"                 # los viajes que salen antes pasan al final del día (+24 h)

# battery.soc_initial no se fija: vale soc_max, como en el paper (restricción (12)).
