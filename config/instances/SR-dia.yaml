# Día hábil completo (servicio L) del electroterminal Santa Rosa: todos sus viajes (17 978).
# Lote 4 de docs/planes/entrega_2.md (cada terminal por separado). Mismo formato que EC-dia.yaml.
extends: ../particion.yaml

case:
  name: SR-dia

data:
  source: subproblema
  trips_file: data/processed/centroide/viajes_dia_habil.csv
  terminal: Santa Rosa
  deadhead_file: data/interim/deadhead_SR.csv   # scripts/generar_deadheads.py --config config/instances/SR-dia.yaml

network:
  day_start: "04:00"                 # los viajes que salen antes pasan al final del día (+24 h)

# battery.soc_initial no se fija: vale soc_max, como en el paper (restricción (12)).
