network:
  time_step_min: 15
  horizon_start: "04:30"
  horizon_end: "23:30"
  horizon_margin: max_deadhead

battery:
  soc_max: 1.00
  soc_min: 0.10
  soc_initial: null
  consumption_kwh_per_km: 1.4
  deadhead_consumption_factor: 0.8

costs:
  currency: USD
  deadhead_cost_per_km: 0.5
  overnight_price_per_kwh: 0.10
  vehicle_fixed_cost: 250
  tou_prices:
    - {start: "00:00", end: "08:00", price: 0.10}
    - {start: "08:00", end: "14:00", price: 0.15}
    - {start: "14:00", end: "17:00", price: 0.22}
    - {start: "17:00", end: "19:00", price: 0.15}
    - {start: "19:00", end: "22:00", price: 0.22}
    - {start: "22:00", end: "00:00", price: 0.11}

initial_solution:
  use_preconnection: true
  T_tc_min: 20
  N_p: 3
  k_sucesores: null
  time_limit_s: null

alns:
  max_iterations: 15000
  destroy_max: 5
  accept_probability: 0.99
  initial_temperature_factor: 0.05
  reaction_factor: 0.5
  scores: [3, 2, 1, 0]
  weight_reset_every: 100
  regret_p: 2
  worst_destroy:
    L_min: 2
    T_max_min: 60
  similarity_destroy:
    power_factor: 3
  post_repair:
    time_limit_s: 30
  operadores_destroy: [random, worst, similarity, vaciar_bus]
  operadores_repair: [greedy, regret]
  chain_destroy:
    budget_factor: 2
    bias: 3
  string_destroy:
    l_max: 4
  cluster_destroy:
    w_station: 20.0
    w_line: 10.0
  greedy_noise_repair:
    noise: 0.15
  vaciar_bus:
    bias: 3
  reinicio_mejor_cada: 500
  seed: 42

solver:
  name: gurobi
  time_limit_s: 14400
  mip_gap: 0.0
